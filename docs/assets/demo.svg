<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="ui-monospace, 'Cascadia Code', 'Consolas', monospace" font-size="14">
  <rect width="840" height="470" rx="10" fill="#1b1d23"/>
  <rect width="840" height="34" rx="10" fill="#2a2d35"/>
  <rect y="24" width="840" height="10" fill="#2a2d35"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="420" y="22" fill="#8b90a0" text-anchor="middle" font-size="12">bxw — Windows browser control for AI agents</text>
  <g>
    <text x="18" y="66" fill="#5ac8fa">$ <tspan fill="#e6e8ee">bxw launch edge https://example.com</tspan></text>
    <text x="18" y="88" fill="#9aa0ad">launched Microsoft Edge agent instance (CDP ready: ws://127.0.0.1:60587)</text>

    <text x="18" y="124" fill="#5ac8fa">$ <tspan fill="#e6e8ee">bxw list tabs edge</tspan></text>
    <text x="18" y="146" fill="#7d8494">ID        TITLE           URL</text>
    <text x="18" y="166" fill="#9aa0ad">F0DBC61D  <tspan fill="#e6e8ee">Example Domain</tspan>  https://example.com/</text>

    <text x="18" y="202" fill="#5ac8fa">$ <tspan fill="#e6e8ee">bxw snapshot F0DBC61D</tspan></text>
    <text x="18" y="224" fill="#e6e8ee">Example Domain</text>
    <text x="18" y="244" fill="#9aa0ad">https://example.com/</text>
    <text x="18" y="264" fill="#c6cbd6"><tspan fill="#27c93f">e1</tspan> StaticText "This domain is for use in documentation examples…"</text>
    <text x="18" y="284" fill="#c6cbd6"><tspan fill="#27c93f">e7</tspan> link "Learn more"</text>

    <text x="18" y="320" fill="#5ac8fa">$ <tspan fill="#e6e8ee">bxw eval F0DBC61D "document.title"</tspan></text>
    <text x="18" y="342" fill="#ffd479">"Example Domain"</text>

    <text x="18" y="378" fill="#5ac8fa">$ <tspan fill="#e6e8ee">bxw stop edge</tspan></text>
    <text x="18" y="400" fill="#9aa0ad">stopped daemon for edge</text>

    <text x="18" y="440" fill="#5ac8fa">$ <tspan fill="#e6e8ee">▋</tspan></text>
  </g>
</svg>
